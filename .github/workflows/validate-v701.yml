name: Validate v7.0.1 ARMv7

on:
  push:
    branches: ["release/v7.0.1"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build ARMv7 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm/v7
          load: true
          push: false
          tags: mesh-controller-test:v701
      - name: Smoke test container
        shell: bash
        run: |
          docker run -d --name mesh-v701-test -p 18088:8088 mesh-controller-test:v701
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18088/ >/tmp/index.html; then break; fi
            sleep 2
          done
          grep -q 'ZÁLOHA CONTROLLERU' /tmp/index.html
          grep -q 'v.7.0.1' /tmp/index.html
          curl -fsS http://127.0.0.1:18088/api/v701/controller-backup >/tmp/backup.json
          grep -q '"version":"7.0.1"' /tmp/backup.json
          docker logs mesh-v701-test --tail 100
