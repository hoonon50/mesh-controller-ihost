<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenWRT MESH CONTROLLER PRO</title>
  <link rel="stylesheet" href="/static/style.css?v=3.6.6">
</head>
<body>
<header>
  <div>
    <h1>OpenWRT MESH CONTROLLER PRO</h1>
    <p>SONOFF iHost · DOCKER · {{ ihost_ip }}</p>
  </div>
  <button id="refreshBtn" class="secondary">Obnovit stav</button>
</header>

<main>
  <section class="metrics" id="metrics"></section>

  <section class="grid-main">
    <article class="card topology-card">
      <div class="card-head">
        <div><h2>TOPOLOGIE</h2></div>
        <div class="legend"><i class="good"></i> dobrý <i class="mid"></i> střední <i class="bad"></i> slabý</div>
      </div>
      <div id="topology" class="topology">
        <svg id="linkLayer"></svg>
        <div id="nodeLayer"></div>
        <div id="linkLabels"></div>
      </div>
    </article>

    <article class="card operation-card">
      <div class="card-head"><div><h2>Průběh operace</h2><p id="opCurrent">Připraveno</p></div><strong id="opPercent">0 %</strong></div>
      <div class="progress"><div id="progressBar"></div></div>
      <div id="opNodes" class="op-nodes"></div>
      <div class="op-meta"><span id="opTime">Čas: 00:00</span><span id="opResult"></span></div>
      <div id="opLog" class="op-log"></div>
    </article>
  </section>

  <section class="card ports-card">
    <div class="card-head">
      <div><h2>LAN PORTY</h2></div>
    </div>
    <div id="portsGrid" class="ports-grid"></div>
  </section>

  <section class="grid-bottom">
    <article class="card">
      <div class="card-head"><div><h2>ÚDRŽBA</h2></div></div>
      <div class="actions maintenance-actions">
        <button data-action="ping" class="warn">PING MESH</button>
        <button data-action="update" class="warn">AKTUALIZACE HW</button>
        <button data-action="reboot" class="reboot-btn">REBOOT</button>
      </div>
      <div class="led-row">
        <label for="ledTarget">LED cíl</label>
        <select id="ledTarget">
          <option value="all">Všechny routery</option>
        </select>
        <button data-action="led_on" class="good-btn">LED ON</button>
        <button data-action="led_off" class="danger">LED OFF</button>
      </div>
    </article>

    <article class="card backups-card">
      <div class="card-head backup-head">
        <div><h2>KONFIGURACE - ZÁLOHY</h2></div>
        <button data-action="backup" class="backup-add-btn" title="Vytvořit novou zálohu" aria-label="Vytvořit novou zálohu">＋</button>
      </div>
      <div id="backupList" class="backup-list"></div>
    </article>
  </section>

  <section class="card clients-card">
    <div class="card-head"><div><h2>Klienti</h2></div></div>
    <div class="table-wrap"><table><thead><tr><th>Router</th><th>Zařízení</th><th>IP</th><th>MAC</th><th>Typ</th><th>RÁDIO</th><th>Detail</th></tr></thead><tbody id="clientsBody"></tbody></table></div>
  </section>
</main>
<script src="/static/app.js?v=3.6.6"></script>
</body>
</html>
