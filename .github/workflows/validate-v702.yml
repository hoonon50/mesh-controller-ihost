name: Validate v7.0.2 ARMv7

on:
  push:
    branches: ["release/v7.0.2"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build ARMv7 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm/v7
          load: true
          push: false
          tags: mesh-controller-test:v702
      - name: Smoke test container
        shell: bash
        run: |
          docker run -d --name mesh-v702-test -p 18088:8088 mesh-controller-test:v702
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:18088/ >/tmp/index.html; then break; fi
            sleep 2
          done
          grep -q 'ZÁLOHA CONTROLLERU' /tmp/index.html
          grep -q 'VE STEJNÝ ČAS JAKO OWUT' /tmp/index.html
          grep -q 'v.7.0.2' /tmp/index.html
          if grep -q '10 MINUT PŘED OWUT' /tmp/index.html; then exit 1; fi
          curl -fsS http://127.0.0.1:18088/api/v701/controller-backup >/tmp/backup.json
          grep -q '"version":"7.0.2"' /tmp/backup.json
          docker exec -i mesh-v702-test python3 - <<'PY'
          from controller_backup_v701 import ControllerBackupManager, VERSION, REMOTE_KEEP

          assert VERSION == "7.0.2"
          assert REMOTE_KEEP == 10

          class DummyApp:
              extensions = {}

          mgr = ControllerBackupManager(DummyApp())
          mgr.start()
          assert mgr.thread is None, "samostatný backup scheduler nesmí běžet"

          names = [
              f"mesh-controller-backup_v7.0.2_202609{day:02d}-040000.tar.gz"
              for day in range(1, 13)
          ]
          xml = ('<?xml version="1.0"?><d:multistatus xmlns:d="DAV:">' + ''.join(
              f'<d:response><d:href>/remote/{name}</d:href></d:response>' for name in names
          ) + '</d:multistatus>').encode()
          deleted = []

          def fake_dav(method, url, cfg, data=None, extra_headers=None):
              if method == "PROPFIND":
                  return 207, {}, xml
              if method == "DELETE":
                  deleted.append(url)
                  return 204, {}, b""
              raise AssertionError(method)

          mgr._dav_request = fake_dav
          result = mgr._prune_nextcloud({}, "https://nextcloud.invalid/remote/", 10)
          assert result["found"] == 12
          assert result["deleted"] == 2
          assert len(deleted) == 2
          assert names[0] in deleted[1] or names[0] in deleted[0]
          assert names[1] in deleted[1] or names[1] in deleted[0]
          PY
          docker logs mesh-v702-test --tail 120
