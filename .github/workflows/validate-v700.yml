name: Validate v7.0.0

on:
  push:
    branches: ["release/v7.0.0"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ARMv7 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm/v7
          push: false
          load: true
          tags: mesh-controller-v700-validation:latest

      - name: Verify final runtime image
        shell: bash
        run: |
          docker run --rm --platform linux/arm/v7 --entrypoint python3 mesh-controller-v700-validation:latest -c "from pathlib import Path; import os; live=Path('/app/live_topology_v503.py').read_text(); lan=Path('/app/lan_port_control_v620.py').read_text(); html=Path('/app/templates/index.html').read_text(); app=Path('/app/app.py').read_text(); assert os.environ['MESH_LIVE_TOPOLOGY_POLL']=='15'; assert os.environ['MESH_LAN_PORT_WATCH_SECONDS']=='15'; assert os.environ['MESH_LAN_PROTECT_SCAN_SECONDS']=='60'; assert 'def _live_port_up' in lan; assert 'nulové SSH' in lan; assert 'time.sleep(max(60, seconds))' in app; assert 'v.7.0.0' in html; assert 'VERSION = \\\"7.0.0\\\"' in live; print('v7.0.0 runtime validation OK')"
